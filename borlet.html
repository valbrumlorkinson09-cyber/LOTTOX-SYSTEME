<!DOCTYPE html>
<html lang="ht">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LOTTOX — Bòlèt</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    background:
    radial-gradient(
        circle at top,
        #182028,
        #080a0d 50%,
        #030405
    );

    color:#fff;

}

header{

    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:#0a0c0f;

    border-bottom:1px solid #292e34;

}

.logo{

    display:flex;
    align-items:center;
    gap:10px;

}

.logo-x{

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:
    linear-gradient(
        145deg,
        #ffd700,
        #ff9d00
    );

    color:#000;

    font-weight:900;

}

.logo-name{

    font-size:20px;

    font-weight:900;

    letter-spacing:2px;

}

.agent{

    color:#ffd000;

    font-size:11px;

    font-weight:bold;

}

main{

    max-width:600px;

    margin:auto;

    padding:25px 15px 80px;

}

.title{

    margin-bottom:20px;

}

.title h1{

    font-size:25px;

    margin-bottom:6px;

}

.title p{

    color:#737b83;

    font-size:12px;

}

.card{

    background:#0f1216;

    border:1px solid #292f35;

    border-radius:18px;

    padding:20px;

}

.field{

    margin-bottom:15px;

}

label{

    display:block;

    color:#aeb4ba;

    font-size:12px;

    margin-bottom:7px;

}

input,
select{

    width:100%;

    height:48px;

    padding:0 13px;

    border-radius:11px;

    border:1px solid #30363d;

    background:#090b0e;

    color:#fff;

    outline:none;

}

input:focus,
select:focus{

    border-color:#ffd000;

}

.quick{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:8px;

    margin-bottom:16px;

}

button{

    cursor:pointer;

}

.quick button{

    height:42px;

    border-radius:9px;

    border:1px solid #343a41;

    background:#171b20;

    color:#ddd;

    font-weight:bold;

}

.quick button:hover{

    border-color:#ffd000;

    color:#ffd000;

}

.main-btn{

    width:100%;

    height:50px;

    border:none;

    border-radius:11px;

    background:
    linear-gradient(

        #ffd700,

    color:#080808;

}

.back{

    background:#111419;

    color:#aaa;

}

@media(max-width:500px){

        grid-template-columns:
        repeat(2,1fr);

    }

}

</style>

</head>


<body>


<header>

    <div class="logo">

        <div class="logo-x">
            X

        <div class="logo-name">
            LOTTOX
        </div>

    </div>

    <div
        class="agent"
        id="agentName"
    >
        AGENT

</header>


<main>


<div class="title">

        🎟️ Nouvo Bòlèt

    <p>
        Kreye yon nouvo tikè pou kliyan an.
    </p>

</div>


<div class="card">

        >
            55

</main>


<script>

/* LOTTOX BORLET — PATI 1 */

function setNumber(number){

    document
    .getElementById("number")
    .value = number;

}


function setAmount(amount){

    document
    .getElementById("amount")
    .value = amount;

}


/* montre non ajan */

const currentAgentId =
    localStorage.getItem(
        "lottoxCurrentAgent"
    );

const agents =
    JSON.parse(
        localStorage.getItem(
            "lottoxAgents"
        )
    ) || [];

const currentAgent =
    agents.find(
        agent =>
        agent.id === currentAgentId
    );


if(currentAgent){

    document
    .getElementById(
        "agentName"
    )
    .textContent =
        currentAgent.name;

}
/* =====================================================
   LOTTOX BÒLÈT — PATI 2
   CREATE + SAVE TICKET
===================================================== */


/* ================= TICKET ID ================= */

function generateTicketID(){

    const time =
        Date.now()
        .toString()
        .slice(-6);

    const random =
        Math.floor(
            10 +
            Math.random() * 90
        );

    return "LX-" +
        time +
        random;

}


/* ================= CREATE TICKET ================= */

function createTicket(){

    const game =
        document
        .getElementById("game")
        .value
        .trim();


    const customer =
        document
        .getElementById("customer")
        .value
        .trim();


    const number =
        document
        .getElementById("number")
        .value
        .trim();


    const amount =
        Number(
            document
            .getElementById("amount")
            .value
        );


    /* ================= VERIFY AGENT ================= */

    if(!currentAgent){

        alert(
            "❌ Sesyon ajan an pa jwenn.\n\n" +
            "Tanpri konekte ankò."
        );

        window.location.href =
            "index.html";

        return;

    }


    /* ================= VALIDATION ================= */

    if(!customer){

        alert(
            "⚠️ Antre non kliyan an."
        );

        document
        .getElementById("customer")
        .focus();

        return;

    }


    if(!number){

        alert(
            "⚠️ Antre nimewo bòlèt la."
        );

        document
        .getElementById("number")
        .focus();

        return;

    }


    if(!amount || amount < 5){

        alert(
            "⚠️ Montan minimòm lan se 5 Gdes."
        );

        document
        .getElementById("amount")
        .focus();

        return;

    }


    /* ================= MACHINE ================= */

    const machine =
        currentAgent.machine ||
        "—";


    /* ================= CREATE ================= */

    const ticket = {

        id:
            generateTicketID(),

        game:
            game,

        customer:
            customer,

        number:
            number,

        amount:
            amount,

        agentId:
            currentAgent.id,

        agentName:
            currentAgent.name,

        machine:
            machine,

        status:
            "VALID",

        createdAt:
            new Date().toISOString()

    };


    /* ================= GET OLD TICKETS ================= */

    let tickets =
        JSON.parse(
            localStorage.getItem(
                "lottoxTickets"
            )
        ) || [];


    /* ================= SAVE ================= */

    tickets.push(
        ticket
    );


    localStorage.setItem(

        "lottoxTickets",

        JSON.stringify(
            tickets
        )

    );


    /* ================= LAST TICKET ================= */

    localStorage.setItem(

        "lottoxLastTicket",

        JSON.stringify(
            ticket
        )

    );


    /* ================= SUCCESS ================= */

    alert(

        "✅ BÒLÈT KREYE!\n\n" +

        "🎟️ Tikè: " +
        ticket.id +

        "\n🔢 Nimewo: " +
        ticket.number +

        "\n💰 Montan: " +
        ticket.amount +
        " Gdes"

    );


    /* ================= CLEAR FORM ================= */

    document
    .getElementById("customer")
    .value = "";


    document
    .getElementById("number")
    .value = "";


    document
    .getElementById("amount")
    .value = "";


    /* ================= RECEIPT ================= */

    showReceipt(
        ticket
    );

}

                "

            </strong>

        </div>


        <div

                justify-content:
                    space-between;

        >

        <div
            style="

                justify-content:

                border-bottom:
                    1px solid #252a30;
            "
        >

            <span>
                Jwèt
            </span>

            <strong>
                ${ticket.game}
            </strong>

        </div>


        <div
            style="
                display:flex;

                    space-between;

                border-bottom:

        >

        <div

        >

        </div>


        <div

                padding:9px 0;

            "
        >

        >

                Machin

            <strong>
                ${escapeText(
                    ticket.machine
                )}
            </strong>

        </div>


        <div
            style="
                margin-top:15px;
                text-align:center;
                color:#32db78;
                font-weight:bold;
            "
        >

            🟢 TIKÈ VALID

        </div>


        <button
            onclick="printTicket()"
            class="main-btn"

                margin-top:15px;
            "

        </button>

    `;

}


/* ================= ESCAPE TEXT ================= */

function escapeText(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* ================= MONEY ================= */

function formatMoney(value){

    return Number(
        value || 0
    ).toLocaleString(
        "en-US"
    );

  }
  /* =====================================================
   LOTTOX — PATI 3/3
   RESI + PRINT + VERIFICATION
===================================================== */

/* ================= VERIFY TICKET ================= */

function verifyTicket(){

    const id =
        prompt(
            "🎟️ Antre ID tikè a:"
        );


    if(!id){

        return;

    }


    const tickets =
        JSON.parse(
            localStorage.getItem(
                "lottoxTickets"
            )
        ) || [];


    const ticket =
        tickets.find(
            item =>
                String(
                    item.id
                ).toUpperCase()
                ===
                String(
                    id
                ).trim().toUpperCase()
        );


    if(!ticket){

        alert(
            "❌ TIKÈ PA JWENN\n\n" +
            "ID sa a pa egziste nan sistèm LOTTOX la."
        );

        return;

    }


    if(
        ticket.status ===
        "CANCELLED"
    ){

        alert(
            "🔴 TIKÈ ANILE\n\n" +
            "ID: " +
            ticket.id
        );

        return;

    }


    alert(

        "🟢 TIKÈ VALID\n\n" +

        "🎟️ ID: " +
        ticket.id +

        "\n🎯 Jwèt: " +
        ticket.game +

        "\n🔢 Nimewo: " +
        ticket.number +

        "\n💰 Montan: " +
        formatMoney(
            ticket.amount
        ) +
        " Gdes" +

        "\n👤 Ajan: " +
        ticket.agentName +

        "\n🚗 Machin: " +
        ticket.machine

    );

}


/* ================= OPEN VERIFY ================= */

function openVerification(){

    const id =
        prompt(
            "🔎 Verifye yon tikè\n\n" +
            "Antre ID tikè a:"
        );


    if(!id){

        return;

    }


    const tickets =
        JSON.parse(
            localStorage.getItem(
                "lottoxTickets"
            )
        ) || [];


    const ticket =
        tickets.find(
            item =>
                String(
                    item.id
                ).toUpperCase()
                ===
                String(
                    id
                ).trim().toUpperCase()
        );


    if(!ticket){

        alert(
            "❌ TIKÈ PA JWENN."
        );

        return;

    }


    let message =

        "🎟️ LOTTOX\n\n" +

        "ID: " +
        ticket.id +

        "\nNimewo: " +
        ticket.number +

        "\nJwèt: " +
        ticket.game +

        "\nMontan: " +
        formatMoney(
            ticket.amount
        ) +
        " Gdes" +

        "\nAjan: " +
        ticket.agentName +

        "\n\n";


    if(
        ticket.status ===
        "VALID"
    ){

        message +=
            "🟢 STATUS: VALID";

    }else{

        message +=
            "🔴 STATUS: " +
            ticket.status;

    }


    alert(
        message
    );

}


/* ================= SECURITY CHECK ================= */

function checkSession(){

    const logged =
        localStorage.getItem(
            "lottoxLoggedIn"
        );


    const agentId =
        localStorage.getItem(
            "lottoxCurrentAgent"
        );


    if(
        logged !== "true" ||
        !agentId
    ){

        alert(
            "🔐 Sesyon ou fini."
        );


        window.location.href =
            "index.html";

        return false;

    }


    return true;

}


/* ================= SESSION CHECK ================= */

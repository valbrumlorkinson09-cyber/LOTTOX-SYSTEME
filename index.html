<!DOCTYPE html>
<html lang="ht">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LOTTOX — Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="login-page">


    <!-- LOGO -->

    <div class="brand">

        <div class="brand-logo">
            X
        </div>

        <div class="brand-name">
            LOTTOX
        </div>

    </div>


    <div class="system-name">
        Smart Lottery Management System
    </div>


    <!-- LOGIN CARD -->

    <div class="login-card">


        <div class="welcome">

            <h1>
                Byenveni 👋
            </h1>

            <p>
                Konekte pou antre
                nan sistèm LOTTOX la.
            </p>

        </div>


        <!-- ID -->

        <div class="login-field">

            <label>
                ID Ajan
            </label>

            <div class="input-box">

                <span>
                    👤
                </span>

                <input
                    type="text"
                    id="agentId"
                    placeholder="Antre ID ajan an"
                    autocomplete="off"
                >

            </div>

        </div>


        <!-- PASSWORD -->

        <div class="login-field">

            <label>
                Modpas
            </label>

            <div class="input-box">

                <span>
                    🔐
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="Antre modpas la"
                >

                <button
                    type="button"
                    class="eye-btn"
                    onclick="togglePassword()"
                >
                    👁️
                </button>

            </div>

        </div>


        <!-- LOGIN -->

        <button
            class="login-btn"
            onclick="login()"
        >
            KONEKTE →
        </button>


        <button
            class="forgot"
            onclick="forgotPassword()"
        >
            Ou bliye modpas ou?
        </button>


    </div>


    <!-- STATUS -->

    <div class="system-status">

        <span class="status-dot"></span>

        LOTTOX System Online

    </div>


    <div class="copyright">

        © 2026 LOTTOX —
        All Rights Reserved

    </div>


</div>


<script>

/* =====================================================
   LOTTOX LOGIN
===================================================== */


/* ================= PASSWORD ================= */

function togglePassword(){

    const password =
        document.getElementById(
            "password"
        );


    if(
        password.type ===
        "password"
    ){

        password.type =
            "text";

    }else{

        password.type =
            "password";

    }

}


/* ================= LOGIN ================= */

function login(){

    const agentId =
        document
        .getElementById(
            "agentId"
        )
        .value
        .trim()
        .toUpperCase();


    const password =
        document
        .getElementById(
            "password"
        )
        .value
        .trim();


    if(!agentId){

        alert(
            "⚠️ Antre ID Ajan ou."
        );

        return;

    }


    if(!password){

        alert(
            "⚠️ Antre modpas ou."
        );

        return;

    }


    const agents =
        JSON.parse(
            localStorage.getItem(
                "lottoxAgents"
            )
        ) || [];


    const agent =
        agents.find(
            item =>

            String(
                item.id
            ).toUpperCase()
            ===
            agentId

            &&

            String(
                item.password
            )
            ===
            password
        );


    if(!agent){

        alert(
            "❌ ID Ajan oswa modpas la pa kòrèk."
        );

        return;

    }


    if(
        agent.status !==
        "ACTIVE"
    ){

        alert(
            "🔴 Kont ajan sa a pa aktif."
        );

        return;

    }


    /* SAVE SESSION */

    localStorage.setItem(
        "lottoxLoggedIn",
        "true"
    );


    localStorage.setItem(
        "lottoxCurrentAgent",
        agent.id
    );


    localStorage.setItem(
        "lottoxCurrentAgentName",
        agent.name
    );


    /* GO DASHBOARD */

    window.location.href =
        "agent.html";

}


/* ================= ENTER ================= */

document
.getElementById("password")
.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            login();

        }

    }
);


/* ================= FORGOT ================= */

function forgotPassword(){

    alert(

        "🔐 Modpas bliye?\n\n" +

        "Tanpri kontakte administratè " +
        "LOTTOX la pou reset modpas ou."

    );

}


/* ================= READY ================= */

console.log(
    "🔐 LOTTOX LOGIN READY"
);

</script>


</body>

</html>

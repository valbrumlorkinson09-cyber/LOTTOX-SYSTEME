<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LOTTOX — Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #182028 0%, #080a0d 45%, #030405 100%);
            color: #fff;
        }

        /* ================= HEADER ================= */

        header {
            height: 70px;
            background: rgba(10, 12, 15, .96);
            border-bottom: 1px solid #252a30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(145deg, #ffd700, #ff9d00);
            color: #090909;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
        }

        .brand-name {
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .agent {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 13px;
            color: #aeb4ba;
        }

        .agent-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #20252b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ================= MAIN ================= */

        main {
            width: 100%;
            max-width: 1250px;
            margin: auto;
            padding: 25px;
        }

        .welcome {
            margin-bottom: 24px;
        }

        .welcome h1 {
            font-size: 25px;
            margin-bottom: 7px;
        }

        .welcome p {
            color: #818890;
            font-size: 13px;
        }

        /* ================= STATS ================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: rgba(15, 18, 22, .95);
            border: 1px solid #252a30;
            border-radius: 16px;
            padding: 18px;
        }

        .stat-title {
            color: #858c94;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 900;
        }

        .stat-icon {
            font-size: 20px;
            margin-bottom: 8px;
        }

        /* ================= GRID ================= */

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.4fr .8fr;
            gap: 20px;
        }

        .card {
            background: rgba(15, 18, 22, .96);
            border: 1px solid #252a30;
            border-radius: 18px;
            padding: 22px;
        }

        .card-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .card-title h2 {
            font-size: 18px;
        }

        .card-title span {
            font-size: 12px;
            color: #777f87;
        }

        /* ================= FORM ================= */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            color: #aeb4ba;
            font-size: 12px;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            height: 49px;
            background: #090b0e;
            border: 1px solid #2b3138;
            border-radius: 11px;
            color: white;
            outline: none;
            padding: 0 13px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            border-color: #ffd000;
            box-shadow: 0 0 0 3px rgba(255,208,0,.07);
        }

        select {
            cursor: pointer;
        }

        /* ================= BET BUTTON ================= */

        .add-btn {
            width: 100%;
            height: 49px;
            border: 1px solid #343a41;
            background: #171b20;
            color: #ffd000;
            border-radius: 11px;
            font-weight: 800;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #20252b;
        }

        /* ================= BET TABLE ================= */

        .bets {
            margin-top: 18px;
            border: 1px solid #292f35;
            border-radius: 12px;
            overflow: hidden;
        }

        .bet-head,
        .bet-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 40px;
            align-items: center;
            gap: 10px;
            padding: 12px;
        }

        .bet-head {
            background: #111419;
            color: #777f87;
            font-size: 11px;
        }

        .bet-row {
            border-top: 1px solid #252a30;
            font-size: 13px;
        }

        .delete-btn {
            border: none;
            background: transparent;
            color: #ff6464;
            cursor: pointer;
            font-size: 17px;
        }

        .empty-bets {
            padding: 25px;
            text-align: center;
            color: #666e76;
            font-size: 12px;
        }

        /* ================= TOTAL ================= */

        .total-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding: 17px;
            border-radius: 13px;
            background: #111419;
            border: 1px solid #292f35;
        }

        .total-box span:first-child {
            color: #9ba1a7;
            font-size: 13px;
        }

        #totalAmount {
            font-size: 23px;
            font-weight: 900;
            color: #ffd000;
        }

        /* ================= PRINT ================= */

        .print-btn {
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 12px;
            margin-top: 14px;
            background: linear-gradient(135deg, #ffd700, #ff9d00);
            color: #090909;
            font-weight: 900;
            cursor: pointer;
            font-size: 15px;
        }

        .print-btn:hover {
            box-shadow: 0 8px 25px rgba(255,193,7,.16);
        }

        /* ================= QUICK ACTIONS ================= */

        .actions {
            display: grid;
            gap: 12px;
        }

        .action {
            width: 100%;
            min-height: 65px;
            border-radius: 13px;
            border: 1px solid #292f35;
            background: #111419;
            color: white;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 13px;
            cursor: pointer;
            text-align: left;
        }

        .action:hover {
            background: #171b20;
        }

        .action-icon {
            width: 42px;
            height: 42px;
            border-radius: 11px;
            background: #20252b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
        }

        .action strong {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .action small {
            color: #747c84;
            font-size: 11px;
        }

        /* ================= RECENT TICKETS ================= */

        .recent {
            margin-top: 20px;
        }

        .ticket-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 0;
            border-bottom: 1px solid #242a30;
        }

        .ticket-item:last-child {
            border-bottom: none;
        }

        .ticket-id {
            font-size: 12px;
            font-weight: bold;
        }

        .ticket-date {
            color: #666e76;
            font-size: 10px;
            margin-top: 4px;
        }

        .ticket-money {
            color: #ffd000;
            font-size: 13px;
            font-weight: bold;
        }

        /* ================= LOGOUT ================= */

        .logout {
            margin-top: 18px;
            width: 100%;
            height: 45px;
            border: 1px solid #3b2727;
            background: #171112;
            color: #ff7474;
            border-radius: 11px;
            cursor: pointer;
            font-weight: bold;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 900px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {

            header {
                padding: 0 15px;
            }

            .agent span {
                display: none;
            }

            main {
                padding: 18px 14px 100px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .stat {
                padding: 14px;
            }

            .stat-value {
                font-size: 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .input-group.full {
                grid-column: auto;
            }

            .card {
                padding: 17px;
            }

            .brand-name {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="brand">
        <div class="brand-logo">X</div>
        <div class="brand-name">LOTTOX</div>
    </div>

    <div class="agent">
        <div class="agent-icon">👤</div>
        <span id="agentName">Agent</span>
    </div>

</header>


<main>

    <div class="welcome">
        <h1>Dashboard 🎰</h1>
        <p>Jere nouvo parye yo epi prepare tikè kliyan yo.</p>
    </div>


    <!-- STATS -->

    <section class="stats">

        <div class="stat">
            <div class="stat-icon">🎟️</div>
            <div class="stat-title">Tikè Jodi a</div>
            <div class="stat-value" id="ticketCount">0</div>
        </div>

        <div class="stat">
            <div class="stat-icon">💰</div>
            <div class="stat-title">Lajan Jodi a</div>
            <div class="stat-value" id="salesTotal">0 Gdes</div>
        </div>

        <div class="stat">
            <div class="stat-icon">🏆</div>
            <div class="stat-title">Gayan</div>
            <div class="stat-value">0</div>
        </div>

        <div class="stat">
            <div class="stat-icon">🟢</div>
            <div class="stat-title">Sistèm</div>
            <div class="stat-value">Online</div>
        </div>

    </section>


    <div class="dashboard-grid">

        <!-- NOUVO PARI -->

        <section class="card">

            <div class="card-title">
                <h2>🎟️ Nouvo Pari</h2>
                <span>LOTTOX</span>
            </div>


            <div class="form-grid">

                <div class="input-group">
                    <label>Jwèt</label>

                    <select id="game">
                        <option value="Bòlèt">Bòlèt</option>
                        <option value="Lotto">Lotto</option>
                        <option value="Special">Special</option>
                    </select>
                </div>


                <div class="input-group">
                    <label>Nimewo</label>

                    <input
                        type="text"
                        id="number"
                        placeholder="Egzanp: 25"
                        maxlength="10"
                    >
                </div>


                <div class="input-group">
                    <label>Montan (Gdes)</label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Egzanp: 50"
                        min="1"
                    >
                </div>


                <div class="input-group">
                    <label>Tip</label>

                    <select id="betType">
                        <option value="Direct">Direct</option>
                        <option value="Perm">Perm</option>
                        <option value="Mariage">Mariage</option>
                    </select>
                </div>

            </div>


            <button class="add-btn" onclick="addBet()">
                ＋ AJOUTE PARI
            </button>


            <!-- BETS -->

            <div class="bets">

                <div class="bet-head">
                    <span>Jwèt</span>
                    <span>Nimewo</span>
                    <span>Montan</span>
                    <span></span>
                </div>

                <div id="betsList">

                    <div class="empty-bets">
                        Pa gen pari ankò.
                    </div>

                </div>

            </div>


            <!-- TOTAL -->

            <div class="total-box">

                <span>TOTAL TIKÈ</span>

                <span id="totalAmount">
                    0 Gdes
                </span>

            </div>


            <button class="print-btn" onclick="printTicket()">
                🖨️ ENPRIME RESI
            </button>

        </section>


        <!-- ACTIONS -->

        <aside>

            <section class="card">

                <div class="card-title">
                    <h2>Aksyon Rapid</h2>
                </div>


                <div class="actions">

                    <button class="action" onclick="verifyTicket()">

                        <div class="action-icon">🔎</div>

                        <div>
                            <strong>Verifye Tikè</strong>
                            <small>Kontwole si yon tikè valid</small>
                        </div>

                    </button>


                    <button class="action" onclick="showHistory()">

                        <div class="action-icon">📋</div>

                        <div>
                            <strong>Istwa Tikè</strong>
                            <small>Gade tikè ki deja fèt</small>
                        </div>

                    </button>


                    <button class="action" onclick="showReports()">

                        <div class="action-icon">📊</div>

                        <div>
                            <strong>Rapò Jodi a</strong>
                            <small>Gade rezime aktivite yo</small>
                        </div>

                    </button>

                </div>


                <!-- RECENT -->

                <div class="recent">

                    <div class="card-title">
                        <h2 style="font-size:15px;">
                            Dènye Tikè
                        </h2>
                    </div>

                    <div id="recentTickets">
                        <div class="empty-bets">
                            Pa gen tikè ankò.
                        </div>
                    </div>

                </div>


                <button class="logout" onclick="logout()">
                    🚪 Dekonekte
                </button>

            </section>

        </aside>

    </div>

</main>


<script>

    /* ================= LOGIN CHECK ================= */

    const loggedIn = localStorage.getItem("lottoxLoggedIn");

    if (loggedIn !== "true") {
        window.location.href = "index.html";
    }


    const agent = localStorage.getItem("lottoxAgent") || "Agent";

    document.getElementById("agentName").textContent =
        "Agent: " + agent;


    /* ================= DATA ================= */

    let bets = [];

    let tickets =
        JSON.parse(localStorage.getItem("lottoxTickets")) || [];


    /* ================= ADD BET ================= */

    function addBet() {

        const game =
            document.getElementById("game").value;

        const number =
            document.getElementById("number").value.trim();

        const amount =
            Number(document.getElementById("amount").value);

        const betType =
            document.getElementById("betType").value;


        if (!number) {
            alert("⚠️ Tanpri antre nimewo a.");
            return;
        }

        if (!amount || amount <= 0) {
            alert("⚠️ Tanpri antre yon montan valid.");
            return;
        }


        bets.push({
            game: game,
            number: number,
            amount: amount,
            type: betType
        });


        document.getElementById("number").value = "";
        document.getElementById("amount").value = "";


        renderBets();
    }


    /* ================= SHOW BETS ================= */

    function renderBets() {

        const list =
            document.getElementById("betsList");


        if (bets.length === 0) {

            list.innerHTML = `
                <div class="empty-bets">
                    Pa gen pari ankò.
                </div>
            `;

            updateTotal();

            return;
        }


        list.innerHTML = "";


        bets.forEach((bet, index) => {

            const row =
                document.createElement("div");

            row.className = "bet-row";


            row.innerHTML = `

                <span>${bet.game}</span>

                <span>
                    ${bet.number}
                    <small style="color:#777;">
                        (${bet.type})
                    </small>
                </span>

                <span>
                    ${formatMoney(bet.amount)} Gdes
                </span>

                <button
                    class="delete-btn"
                    onclick="removeBet(${index})"
                >
                    ×
                </button>

            `;


            list.appendChild(row);

        });


        updateTotal();
    }


    /* ================= REMOVE BET ================= */

    function removeBet(index) {

        bets.splice(index, 1);

        renderBets();
    }


    /* ================= TOTAL ================= */

    function updateTotal() {

        const total =
            bets.reduce(
                (sum, bet) => sum + bet.amount,
                0
            );


        document.getElementById("totalAmount").textContent =
            formatMoney(total) + " Gdes";
    }


    /* ================= PRINT =================

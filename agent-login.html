<!DOCTYPE html>
<html lang="ht">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LOTTOX — Agent Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
    radial-gradient(
        circle at top,
        #182028 0%,
        #080a0d 45%,
        #030405 100%
    );

    color:#fff;
}

.login-page{

    width:100%;

    max-width:420px;

    text-align:center;
}

.brand{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    margin-bottom:8px;
}

.logo{

    width:48px;

    height:48px;

    border-radius:13px;

    background:
    linear-gradient(
        135deg,
        #ffd700,
        #ff9d00
    );

    color:#080808;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:20px;

    font-weight:900;
}

.brand-name{

    font-size:24px;

    font-weight:900;

    letter-spacing:3px;
}

.system-name{

    color:#777f87;

    font-size:11px;

    margin-bottom:25px;
}

.login-card{

    background:#0f1216;

    border:1px solid #252a30;

    border-radius:20px;

    padding:25px;

    text-align:left;

    box-shadow:
    0 20px 60px
    rgba(0,0,0,.35);
}

.welcome{

    text-align:center;

    margin-bottom:24px;
}

.welcome h1{

    font-size:22px;

    margin-bottom:8px;
}

.welcome p{

    color:#777f87;

    font-size:11px;

    line-height:1.6;
}

.field{

    margin-bottom:16px;
}

.field label{

    display:block;

    color:#aeb4ba;

    font-size:11px;

    margin-bottom:7px;
}

.input-box{

    display:flex;

    align-items:center;

    gap:9px;

    height:48px;

    background:#090b0e;

    border:1px solid #2c3239;

    border-radius:10px;

    padding:0 12px;
}

.input-box:focus-within{

    border-color:#ffd000;
}

.input-box span{

    font-size:16px;
}

.input-box input{

    width:100%;

    height:100%;

    border:0;

    outline:0;

    background:transparent;

    color:#fff;

    font-size:12px;
}

.input-box input::placeholder{

    color:#555d65;
}

.eye-btn{

    border:0;

    background:transparent;

    color:#aaa;

    cursor:pointer;

    font-size:15px;
}

.login-btn{

    width:100%;

    height:49px;

    border:0;

    border-radius:10px;

    background:
    linear-gradient(
        135deg,
        #ffd700,
        #ff9d00
    );

    color:#080808;

    font-weight:900;

    cursor:pointer;

    margin-top:5px;
}

.login-btn:active{

    transform:scale(.98);
}

.forgot{

    display:block;

    margin:17px auto 0;

    border:0;

    background:transparent;

    color:#888f96;

    cursor:pointer;

    font-size:10px;
}

.status{

    margin-top:18px;

    color:#32db78;

    font-size:10px;
}

.dot{

    display:inline-block;

    width:7px;

    height:7px;

    background:#32db78;

    border-radius:50%;

    margin-right:5px;
}

.copyright{

    margin-top:20px;

    color:#454c53;

    font-size:9px;
}

</style>

</head>

<body>

<div class="login-page">

    <div class="brand">

        <div class="logo">
            X
        </div>

        <div class="brand-name">
            LOTTOX
        </div>

    </div>

    <div class="system-name">
        Smart Lottery Management System
    </div>

    <div class="login-card">

        <div class="welcome">

            <h1>
                Byenveni Ajan 👋
            </h1>

            <p>
                Konekte pou antre nan
                sistèm LOTTOX la.
            </p>

        </div>

        <div class="field">

            <label>
                ID Ajan
            </label>

            <div class="input-box">

                <span>
                    👤
                </span>

                <input
                    type="text"
                    id="agentId"
                    placeholder="Antre ID ajan an"
                    autocomplete="off"
                >

            </div>

        </div>

        <div class="field">

            <label>
                Modpas
            </label>

            <div class="input-box">

                <span>
                    🔐
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="Antre modpas ajan an"
                >

                <button
                    type="button"
                    class="eye-btn"
                    onclick="togglePassword()"
                >
                    👁️
                </button>

            </div>

        </div>

        <button
            class="login-btn"
            onclick="loginAgent()"
        >
            KONEKTE →
        </button>

        <button
            class="forgot"
            onclick="forgotPassword()"
        >
            Ou bliye modpas ou?
        </button>

    </div>

    <div class="status">

        <span class="dot"></span>

        LOTTOX System Online

    </div>

    <div class="copyright">

        © 2026 LOTTOX —
        All Rights Reserved

    </div>

      </div>
      <script>

/* ================= DATABASE ================= */

let agents =
    JSON.parse(
        localStorage.getItem(
            "lottoxAgents"
        )
    ) || [];


/* ================= PASSWORD ================= */

function togglePassword(){

    const password =
        document.getElementById(
            "password"
        );


    if(
        password.type ===
        "password"
    ){

        password.type =
            "text";

    }else{

        password.type =
            "password";

    }

}


/* ================= LOGIN ================= */

function loginAgent(){

    const agentId =
        document
        .getElementById(
            "agentId"
        )
        .value
        .trim()
        .toUpperCase();


    const password =
        document
        .getElementById(
            "password"
        )
        .value
        .trim();


    /* CHECK ID */

    if(!agentId){

        alert(
            "⚠️ Antre ID ajan an."
        );

        return;

    }


    /* CHECK PASSWORD */

    if(!password){

        alert(
            "⚠️ Antre modpas ajan an."
        );

        return;

    }


    /* FIND AGENT */

    const agent =
        agents.find(
            item =>

            String(
                item.id
            )
            .toUpperCase()
            ===
            agentId

            &&

            String(
                item.password
            )
            ===
            password
        );


    /* NOT FOUND */

    if(!agent){

        alert(
            "❌ ID ajan oswa modpas la pa kòrèk."
        );

        return;

    }


    /* STATUS */

    if(
        agent.status !==
        "ACTIVE"
    ){

        alert(
            "🔴 Kont ajan sa pa aktif."
        );

        return;

    }


    /* SAVE SESSION */

    localStorage.setItem(
        "lottoxAgentLoggedIn",
        "true"
    );


    localStorage.setItem(
        "lottoxCurrentAgent",
        agent.id
    );


    localStorage.setItem(
        "lottoxCurrentAgentName",
        agent.name
    );


    localStorage.setItem(
        "lottoxCurrentAgentClient",
        agent.clientId || ""
    );


    localStorage.setItem(
        "lottoxCurrentAgentMachine",
        agent.machineId || ""
    );


    /* GO DASHBOARD */

    window.location.href =
        "agent.html";

}


/* ================= ENTER KEY ================= */

document
    .getElementById(
        "password"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key ===
                "Enter"
            ){

                loginAgent();

            }

        }
    );


document
    .getElementById(
        "agentId"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key ===
                "Enter"
            ){

                loginAgent();

            }

        }
    );


/* ================= FORGOT ================= */

function forgotPassword(){

    alert(

        "🔐 Modpas bliye?\n\n" +

        "Tanpri kontakte administratè " +

        "LOTTOX la pou reset modpas ou."

    );
  /* ================= READY ================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const agentId =
            document.getElementById(
                "agentId"
            );


        if(agentId){

            agentId.focus();

        }


        console.log(
            "🔐 LOTTOX AGENT LOGIN READY"
        );

    }
);


/* ================= END ================= */

}

</script>

</body>

</html>

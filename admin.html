<!DOCTYPE html>
<html lang="ht">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LOTTOX — Admin</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at top,
            #182028,
            #080a0d 45%,
            #030405
        );
    color:#fff;
}

header{
    height:70px;
    background:#0a0c0f;
    border-bottom:1px solid #252a30;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand-logo{
    width:42px;
    height:42px;
    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #ffd700,
            #ff9d00
        );

    color:#090909;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:900;
    font-size:18px;
}

.brand-name{
    font-size:21px;
    font-weight:900;
    letter-spacing:2px;
}

.admin-badge{
    color:#ffd000;
    font-size:11px;
    font-weight:bold;
}

main{
    width:100%;
    max-width:1250px;
    margin:auto;
    padding:28px 20px 100px;
}

.page-title{
    margin-bottom:25px;
}

.page-title h1{
    font-size:27px;
    margin-bottom:7px;
}

.page-title p{
    color:#7d858d;
    font-size:13px;
}

.stats{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:14px;
    margin-bottom:22px;
}

.stat{
    background:#0f1216;
    border:1px solid #252a30;
    border-radius:16px;
    padding:18px;
}

.stat-icon{
    font-size:21px;
    margin-bottom:9px;
}

.stat-label{
    color:#777f87;
    font-size:11px;
    margin-bottom:7px;
}

.stat-value{
    font-size:22px;
    font-weight:900;
}

.grid{
    display:grid;
    grid-template-columns:.8fr 1.2fr;
    gap:20px;
}

.card{
    background:#0f1216;
    border:1px solid #252a30;
    border-radius:18px;
    padding:22px;
}

.card-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.card-title h2{
    font-size:17px;
}

.card-title span{
    color:#707880;
    font-size:11px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    color:#aeb4ba;
    font-size:12px;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    height:48px;

    background:#090b0e;

    border:1px solid #2c3239;

    border-radius:11px;

    color:white;
    outline:none;

    padding:0 13px;

    font-size:13px;
}

input:focus,
select:focus{
    border-color:#ffd000;

    box-shadow:
        0 0 0 3px
        rgba(255,208,0,.07);
}

.primary-btn{
    width:100%;
    height:50px;

    border:none;
    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #ffd700,
            #ff9d00
        );

    color:#090909;

    font-weight:900;
    cursor:pointer;
}

.machine-list{
    display:grid;
    gap:10px;
}

.machine{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;
    padding:14px;

    background:#111419;

    border:1px solid #292f35;
    border-radius:12px;
}

.machine-info strong{
    display:block;
    font-size:13px;
    margin-bottom:5px;
}

.machine-info small{
    color:#707880;
    font-size:10px;
}

.machine-status{
    padding:6px 9px;

    border-radius:7px;

    font-size:9px;
    font-weight:900;

    white-space:nowrap;
}

.active{
    color:#32db78;
    background:rgba(32,219,120,.08);
    border:1px solid rgba(32,219,120,.18);
}

.inactive{
    color:#ff7070;
    background:rgba(255,70,70,.08);
    border:1px solid rgba(255,70,70,.18);
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:600px;
}

th{
    text-align:left;
    background:#090b0e;
    color:#707880;
    font-size:10px;
    padding:12px;
}

td{
    padding:13px 12px;
    border-top:1px solid #252a30;
    font-size:11px;
}

.actions{
    display:flex;
    gap:7px;
}

.small-btn{
    border:1px solid #343a41;
    background:#171b20;
    color:#ddd;

    border-radius:7px;

    padding:7px 9px;

    cursor:pointer;
    font-size:10px;
}

.danger-btn{
    color:#ff7373;
    border-color:#3a2727;
}

.empty{
    padding:25px;
    text-align:center;

    color:#666e76;
    font-size:12px;

    border:1px dashed #292f35;
    border-radius:11px;
}

.nav{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:10px;

    margin-bottom:22px;
}

.nav button{
    height:45px;

    border:1px solid #292f35;

    background:#111419;

    color:#aeb4ba;

    border-radius:10px;

    cursor:pointer;

    font-size:11px;
}

.nav button:hover,
.nav button.active-nav{
    color:#ffd000;
    border-color:#4b401d;
    background:#171714;
}

.logout{
    margin-top:20px;

    width:100%;
    height:46px;

    border:1px solid #3b2727;

    background:#171112;

    color:#ff7474;

    border-radius:11px;

    cursor:pointer;

    font-weight:bold;
}

@media(max-width:900px){

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

    .grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    header{
        padding:0 14px;
    }

    .brand-name{
        font-size:18px;
    }

    .admin-badge{
        display:none;
    }

    main{
        padding:22px 14px 80px;
    }

    .stats{
        gap:9px;
    }

    .stat{
        padding:14px;
    }

    .stat-value{
        font-size:18px;
    }

    .card{
        padding:17px;
    }

    .nav{
        grid-template-columns:
            repeat(2,1fr);
    }

}

</style>

</head>

<script>

/* LOTTOX JS — Pati 1 */

if(
    localStorage.getItem(
        "lottoxLoggedIn"
    ) !== "true"
){

    window.location.href =
        "index.html";

}

let agents =
    JSON.parse(
        localStorage.getItem(
            "lottoxAgents"
        )
    ) || [];

let machines =
    JSON.parse(
        localStorage.getItem(
            "lottoxMachines"
        )
    ) || [];

let tickets =
    JSON.parse(
        localStorage.getItem(
            "lottoxTickets"
        )
    ) || [];

let rentals =
    JSON.parse(
        localStorage.getItem(
            "lottoxRentals"
        )
    ) || [];

function saveData(){

    localStorage.setItem(
        "lottoxAgents",
        JSON.stringify(agents)
    );

    localStorage.setItem(
        "lottoxMachines",
        JSON.stringify(machines)
    );

    localStorage.setItem(
        "lottoxTickets",
        JSON.stringify(tickets)
    );

}

function generateID(prefix){

    return prefix +
        "-" +
        Math.floor(
            100000 +
            Math.random()*900000
        );

}

function showSection(section){

    [
        "overview",
        "agents",
        "machines",
        "tickets"
    ].forEach(id => {

        const el =
            document.getElementById(id);

        if(el){

            el.style.display =
                id === section
                ? "block"
                : "none";

        }

    });

    document
        .querySelectorAll(".nav button")
        .forEach(btn =>
            btn.classList.remove(
                "active-nav"
            )
        );

    const index = {
        overview:0,
        agents:1,
        machines:2,
        tickets:3
    };

    const buttons =
        document.querySelectorAll(
            ".nav button"
        );

    if(buttons[index[section]]){

        buttons[index[section]]
            .classList.add(
                "active-nav"
            );

    }

}

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function formatMoney(value){

    return Number(
        value || 0
    ).toLocaleString("en-US");

}
/* =====================================================
   LOTTOX — ADD AGENT
   ID + PASSWORD + STATUS
===================================================== */

function addAgent(){

    const name =
        document
        .getElementById("agentName")
        .value
        .trim();

    const phone =
        document
        .getElementById("agentPhone")
        .value
        .trim();

    const machine =
        document
        .getElementById("agentMachine")
        .value
        .trim();


    /* ================= VALIDATION ================= */

    if(!name){

        alert(
            "⚠️ Antre non ajan an."
        );

        return;
    }


    if(!phone){

        alert(
            "⚠️ Antre telefòn ajan an."
        );

        return;
    }


    if(!machine){

        alert(
            "⚠️ Antre ID machin nan."
        );

        return;
    }


    /* ================= GENERATE ID ================= */

    const agentID =
        generateID("AG");


    /* ================= GENERATE PASSWORD ================= */

    const password =
        generatePassword();


    /* ================= CREATE AGENT ================= */

    const newAgent = {

        id:
            agentID,

        name:
            name,

        phone:
            phone,

        machine:
            machine,

        password:
            password,

        status:
            "ACTIVE",

        createdAt:
            new Date().toISOString()

    };


    /* ================= SAVE ================= */

    agents.push(
        newAgent
    );


    localStorage.setItem(

        "lottoxAgents",

        JSON.stringify(
            agents
        )

    );


    /* ================= CLEAR FORM ================= */

    document
        .getElementById(
            "agentName"
        )
        .value = "";


    document
        .getElementById(
            "agentPhone"
        )
        .value = "";


    document
        .getElementById(
            "agentMachine"
        )
        .value = "";


    /* ================= UPDATE ================= */

    updateStats();


    displayAgents();


    /* ================= SHOW LOGIN INFO ================= */

    alert(

        "✅ AJAN KREYE AVÈK SIKSÈ!\n\n" +

        "🆔 ID Ajan: " +
        agentID +

        "\n\n🔐 Modpas: " +
        password +

        "\n\n🚗 Machin: " +
        machine +

        "\n\n🟢 Status: ACTIVE\n\n" +

        "Bay ajan an ID ak modpas sa yo."

    );

}


/* =====================================================
   GENERATE AGENT PASSWORD
===================================================== */

function generatePassword(){

    const number =
        Math.floor(
            1000 +
            Math.random() *
            9000
        );


    return String(
        number
    );

}

/* ================= AJOUTE MACHIN ================= */

function addMachine(){

    const name =
        document.getElementById(
            "machineName"
        ).value.trim();

    const owner =
        document.getElementById(
            "machineOwner"
        ).value.trim();

    const price =
        Number(
            document.getElementById(
                "machinePrice"
            ).value
        );


    if(!name){

        alert(
            "⚠️ Antre non / ID machin nan."
        );

        return;
    }


    const exists =
        machines.find(
            machine =>
                machine.name
                    .toLowerCase()
                ===
                name.toLowerCase()
        );


    if(exists){

        alert(
            "⚠️ Machin sa a deja egziste."
        );

        return;
    }


    const machine = {

        id: generateID("LOT"),

        name: name,

        owner: owner,

        price: price || 0,

        status: "ACTIVE",

        createdAt:
            new Date().toISOString()

    };


    machines.push(machine);

    saveData();


    document.getElementById(
        "machineName"
    ).value = "";

    document.getElementById(
        "machineOwner"
    ).value = "";

    document.getElementById(
        "machinePrice"
    ).value = "";


    updateStats();

    displayMachines();


    alert(
        "✅ Machin ajoute!\n\n" +
        "ID: " +
        machine.id
    );

}


/* ================= AFFICHER AJAN ================= */

function displayAgents(){

    const box =
        document.getElementById(
            "agentsList"
        );


    const total =
        document.getElementById(
            "agentTotal"
        );


    if(!box) return;


    if(total){

        total.textContent =
            agents.length +
            " ajan";

    }


    if(!agents.length){

        box.innerHTML = `

            <div class="empty">

                👥 Pa gen ajan
                pou kounye a.

            </div>

        `;

        return;
    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>
                        AJAN
                    </th>

                    <th>
                        TELEFÒN
                    </th>

                    <th>
                        MACHIN
                    </th>

                    <th>
                        STATUS
                    </th>

                    <th>
                        AKSYON
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    agents.forEach(
        agent => {

            html += `

                <tr>

                    <td>

                        <strong>
                            ${escapeHTML(
                                agent.name
                            )}
                        </strong>

                        <br>

                        <small>
                            ${escapeHTML(
                                agent.id
                            )}
                        </small>

                    </td>


                    <td>
                        ${escapeHTML(
                            agent.phone
                        )}
                    </td>


                    <td>
                        ${
                            agent.machine
                            ? escapeHTML(
                                agent.machine
                              )
                            : "—"
                        }
                    </td>


                    <td>

                        <span
                            class="
                                status
                                ${
                                    agent.status
                                    === "ACTIVE"
                                    ? "active"
                                    : "inactive"
                                }
                            "
                        >

                            ${
                                agent.status
                                === "ACTIVE"
                                ? "AKTIF"
                                : "INAKTIF"
                            }

                        </span>

                    </td>


                    <td>

                        <div class="actions">

                            <button
                                class="small-btn"
                                onclick="
                                    toggleAgent(
                                        '${agent.id}'
                                    )
                                "
                            >

                                ${
                                    agent.status
                                    === "ACTIVE"
                                    ? "⏸️"
                                    : "▶️"
                                }

                            </button>


                            <button
                                class="
                                    small-btn
                                    danger-btn
                                "
                                onclick="
                                    deleteAgent(
                                        '${agent.id}'
                                    )
                                "
                            >
                                🗑️
                            </button>

                        </div>

                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    box.innerHTML = html;

}


/* ================= TOGGLE AJAN ================= */

function toggleAgent(id){

    const agent =
        agents.find(
            item =>
                item.id === id
        );


    if(!agent) return;


    agent.status =
        agent.status === "ACTIVE"
        ? "INACTIVE"
        : "ACTIVE";


    saveData();

    displayAgents();

    updateStats();

}


/* ================= DELETE AJAN ================= */

function deleteAgent(id){

    const agent =
        agents.find(
            item =>
                item.id === id
        );


    if(!agent) return;


    const ok =
        confirm(
            "⚠️ Efase ajan " +
            agent.name +
            "?"
        );


    if(!ok) return;


    agents =
        agents.filter(
            item =>
                item.id !== id
        );


    saveData();

    displayAgents();

    updateStats();


    alert(
        "✅ Ajan efase."
    );

}


/* ================= AFFICHER MACHIN ================= */

function displayMachines(){

    const box =
        document.getElementById(
            "machinesList"
        );


    const total =
        document.getElementById(
            "machineTotal"
        );


    if(!box) return;


    if(total){

        total.textContent =
            machines.length +
            " machin";

    }


    if(!machines.length){

        box.innerHTML = `

            <div class="empty">

                🚗 Pa gen machin
                pou kounye a.

            </div>

        `;

        return;
    }


    box.innerHTML = "";


    machines.forEach(
        machine => {

            const rental =
                rentals.find(
                    r =>
                        r.machine ===
                            machine.name
                        &&
                        r.status ===
                            "ACTIVE"
                );


            const rented =
                rental &&
                getRentalDays(
                    rental
                ) >= 0;


            const available =
                machine.status ===
                    "ACTIVE"
                &&
                !rented;


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "machine";


            div.innerHTML = `

                <div
                    class="machine-info"
                >

                    <strong>

                        🚗
                        ${escapeHTML(
                            machine.name
                        )}

                    </strong>


                    <small>

                        ID:
                        ${escapeHTML(
                            machine.id
                        )}

                        ·

                        ${
                            machine.owner
                            ? escapeHTML(
                                machine.owner
                              )
                            : "Pa gen kliyan"
                        }

                        ·

                        ${formatMoney(
                            machine.price
                        )}
                        Gdes/mwa

                    </small>

                </div>


                <div>

                    <span
                        class="
                            machine-status
                            ${
                                available
                                ? "active"
                                : "inactive"
                            }
                        "
                    >

                        ${
                            machine.status !==
                            "ACTIVE"

                            ? "INAKTIF"

                            : rented
                            ? "LWE"

                            : "DISPONIB"
                        }

                    </span>


                    <button
                        class="small-btn"
                        onclick="
                            toggleMachine(
                                '${machine.id}'
                            )
                        "
                    >

                        ${
                            machine.status ===
                            "ACTIVE"
                            ? "⏸️"
                            : "▶️"
                        }

                    </button>


                    <button
                        class="
                            small-btn
                            danger-btn
                        "
                        onclick="
                            deleteMachine(
                                '${machine.id}'
                            )
                        "
                    >
                        🗑️
                    </button>

                </div>

            `;


            box.appendChild(div);

        }
    );

}


/* ================= JOU KONTRA ================= */

function getRentalDays(rental){

    if(!rental.endDate){

        return -1;

    }


    const end =
        new Date(
            rental.endDate +
            "T23:59:59"
        );


    return Math.ceil(
        (
            end.getTime() -
            Date.now()
        ) /
        86400000
    );

}


/* ================= MACHIN ON/OFF ================= */

function toggleMachine(id){

    const machine =
        machines.find(
            item =>
                item.id === id
        );


    if(!machine) return;


    machine.status =
        machine.status ===
        "ACTIVE"
        ? "INACTIVE"
        : "ACTIVE";


    saveData();

    displayMachines();

    updateStats();

}


/* ================= EFase MACHIN ================= */

function deleteMachine(id){

    const machine =
        machines.find(
            item =>
                item.id === id
        );


    if(!machine) return;


    const activeRental =
        rentals.find(
            rental =>
                rental.machine ===
                    machine.name
                &&
                rental.status ===
                    "ACTIVE"
        );


    if(activeRental){

        alert(
            "⚠️ Ou pa ka efase machin sa a.\n\n" +
            "Machin nan gen yon kontra aktif."
        );

        return;
    }


    const ok =
        confirm(
            "⚠️ Efase machin " +
            machine.name +
            "?"
        );


    if(!ok) return;


    machines =
        machines.filter(
            item =>
                item.id !== id
        );


    saveData();

    displayMachines();

    updateStats();


    alert(
        "✅ Machin efase."
    );

    }

/* ================= AFFICHER TIKÈ ================= */

function displayTickets(){

    const box =
        document.getElementById(
            "ticketsList"
        );

    const total =
        document.getElementById(
            "ticketTotal"
        );


    if(!box) return;


    if(total){

        total.textContent =
            tickets.length +
            " tikè";

    }


    if(!tickets.length){

        box.innerHTML = `

            <div class="empty">

                🎟️ Pa gen tikè
                pou kounye a.

            </div>

        `;

        return;
    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>
                        TIKÈ
                    </th>

                    <th>
                        DAT
                    </th>

                    <th>
                        CHWA
                    </th>

                    <th>
                        MONTAN
                    </th>

                    <th>
                        STATUS
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    tickets
        .slice()
        .reverse()
        .forEach(ticket => {

            const status =
                ticket.status ||
                "VALID";


            html += `

                <tr>

                    <td>

                        <strong>

                            ${
                                escapeHTML(
                                    ticket.id ||
                                    "—"
                                )
                            }

                        </strong>

                    </td>


                    <td>

                        ${
                            ticket.createdAt
                            ? formatDate(
                                ticket.createdAt
                              )
                            : "—"
                        }

                    </td>


                    <td>

                        ${
                            ticket.number
                            ? escapeHTML(
                                ticket.number
                              )
                            : ticket.numbers
                            ? escapeHTML(
                                Array.isArray(
                                    ticket.numbers
                                )
                                ? ticket.numbers.join(
                                    ", "
                                  )
                                : ticket.numbers
                              )
                            : "—"
                        }

                    </td>


                    <td>

                        ${
                            formatMoney(
                                ticket.amount ||
                                ticket.price ||
                                ticket.montant ||
                                0
                            )
                        }

                        Gdes

                    </td>


                    <td>

                        <span
                            class="
                                status
                                ${
                                    status ===
                                    "VALID"
                                    ||
                                    status ===
                                    "WIN"
                                    ||
                                    status ===
                                    "PAID"
                                    ? "active"
                                    : "inactive"
                                }
                            "
                        >

                            ${
                                escapeHTML(
                                    status
                                )
                            }

                        </span>

                    </td>

                </tr>

            `;

        });


    html += `

            </tbody>

        </table>

    `;


    box.innerHTML = html;

}


/* ================= FORMAT DAT ================= */

function formatDate(date){

    try{

        return new Date(
            date
        ).toLocaleString(
            "fr-FR",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(error){

        return "—";

    }

}


/* ================= TOTAL LAVANT ================= */

function calculateSales(){

    let total = 0;


    tickets.forEach(ticket => {

        total += Number(
            ticket.amount ||
            ticket.price ||
            ticket.montant ||
            0
        );

    });


    return total;

}


/* ================= UPDATE STATS ================= */

function updateStats(){

    const agentCount =
        document.getElementById(
            "agentCount"
        );


    const machineCount =
        document.getElementById(
            "machineCount"
        );


    const ticketCount =
        document.getElementById(
            "ticketCount"
        );


    const salesTotal =
        document.getElementById(
            "salesTotal"
        );


    if(agentCount){

        agentCount.textContent =
            agents.length;

    }


    if(machineCount){

        machineCount.textContent =
            machines.length;

    }


    if(ticketCount){

        ticketCount.textContent =
            tickets.length;

    }


    if(salesTotal){

        salesTotal.textContent =
            formatMoney(
                calculateSales()
            ) +
            " Gdes";

    }


    const agentTotal =
        document.getElementById(
            "agentTotal"
        );


    if(agentTotal){

        agentTotal.textContent =
            agents.length +
            " ajan";

    }


    const machineTotal =
        document.getElementById(
            "machineTotal"
        );


    if(machineTotal){

        machineTotal.textContent =
            machines.length +
            " machin";

    }


    const ticketTotal =
        document.getElementById(
            "ticketTotal"
        );


    if(ticketTotal){

        ticketTotal.textContent =
            tickets.length +
            " tikè";

    }

}

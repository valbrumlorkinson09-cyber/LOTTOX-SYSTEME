<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LOTTOX — Verifye Tikè</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #182028 0%, #080a0d 45%, #030405 100%);
            color: #fff;
        }

        /* HEADER */

        header {
            height: 70px;
            background: rgba(10, 12, 15, .97);
            border-bottom: 1px solid #252a30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(145deg, #ffd700, #ff9d00);
            color: #090909;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
        }

        .brand-name {
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .back-btn {
            border: 1px solid #30363d;
            background: #111419;
            color: #ddd;
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 12px;
        }

        .back-btn:hover {
            background: #1b2026;
        }

        /* MAIN */

        main {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 30px 20px 100px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .page-title .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 20px;
            background: #151a1f;
            border: 1px solid #2b3138;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .page-title h1 {
            font-size: 26px;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #7d858d;
            font-size: 13px;
        }

        /* VERIFY CARD */

        .verify-card {
            max-width: 650px;
            margin: auto;
            background: rgba(15, 18, 22, .97);
            border: 1px solid #252a30;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .input-label {
            display: block;
            color: #aeb4ba;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            height: 54px;
            background: #090b0e;
            border: 1px solid #2d333a;
            border-radius: 12px;
            outline: none;
            color: white;
            padding: 0 15px;
            font-size: 15px;
            text-transform: uppercase;
        }

        .search-box input:focus {
            border-color: #ffd000;
            box-shadow: 0 0 0 3px rgba(255,208,0,.07);
        }

        .verify-btn {
            height: 54px;
            padding: 0 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ffd700, #ff9d00);
            color: #090909;
            font-weight: 900;
            cursor: pointer;
        }

        .verify-btn:hover {
            box-shadow: 0 7px 20px rgba(255,193,7,.15);
        }

        /* RESULT */

        #result {
            display: none;
            margin-top: 22px;
        }

        .result-card {
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #30363d;
            background: #111419;
        }

        .result-status {
            text-align: center;
            padding-bottom: 18px;
            border-bottom: 1px solid #292f35;
        }

        .status-icon {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .status-icon.valid {
            background: rgba(32,212,107,.12);
            border: 1px solid rgba(32,212,107,.3);
        }

        .status-icon.winner {
            background: rgba(255,208,0,.12);
            border: 1px solid rgba(255,208,0,.3);
        }

        .status-icon.paid {
            background: rgba(70,150,255,.12);
            border: 1px solid rgba(70,150,255,.3);
        }

        .status-icon.invalid {
            background: rgba(255,70,70,.12);
            border: 1px solid rgba(255,70,70,.3);
        }

        .result-status h2 {
            margin-top: 12px;
            font-size: 21px;
        }

        .result-status p {
            margin-top: 5px;
            color: #858c94;
            font-size: 12px;
        }

        /* TICKET INFO */

        .ticket-info {
            margin-top: 18px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 11px 0;
            border-bottom: 1px solid #242a30;
            font-size: 12px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row span:first-child {
            color: #737b83;
        }

        .info-row span:last-child {
            font-weight: bold;
            text-align: right;
        }

        /* BET LIST */

        .bet-title {
            font-size: 14px;
            margin: 20px 0 10px;
        }

        .bet-table {
            border: 1px solid #292f35;
            border-radius: 11px;
            overflow: hidden;
        }

        .bet-head,
        .bet-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            padding: 11px;
            font-size: 11px;
        }

        .bet-head {
            background: #090b0e;
            color: #707880;
        }

        .bet-row {
            border-top: 1px solid #252a30;
        }

        .total {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-radius: 11px;
            background: #090b0e;
        }

        .total span:first-child {
            color: #858c94;
            font-size: 12px;
        }

        .total span:last-child {
            color: #ffd000;
            font-size: 20px;
            font-weight: 900;
        }

        /* PAY BUTTON */

        .pay-btn {
            display: none;
            width: 100%;
            height: 52px;
            margin-top: 15px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #20d46b, #0da653);
            color: white;
            font-weight: 900;
            cursor: pointer;
        }

        .pay-btn:hover {
            box-shadow: 0 8px 20px rgba(32,212,107,.15);
        }

        /* MESSAGE */

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 12px;
        }

        .message.error {
            display: block;
            background: rgba(255,60,60,.08);
            border: 1px solid rgba(255,60,60,.2);
            color: #ff7777;
        }

        .message.success {
            display: block;
            background: rgba(32,212,107,.08);
            border: 1px solid rgba(32,212,107,.2);
            color: #4ee58a;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding: 0 14px;
            }

            .brand-name {
                font-size: 18px;
            }

            main {
                padding: 25px 14px 80px;
            }

            .verify-card {
                padding: 18px;
            }

            .search-box {
                flex-direction: column;
            }

            .verify-btn {
                width: 100%;
            }

            .bet-head,
            .bet-row {
                font-size: 10px;
                padding: 9px;
            }

            .info-row {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="brand">

        <div class="brand-logo">
            X
        </div>

        <div class="brand-name">
            LOTTOX
        </div>

    </div>

    <button class="back-btn" onclick="goBack()">
        ← Dashboard
    </button>

</header>


<main>

    <div class="page-title">

        <div class="icon">
            🔎
        </div>

        <h1>Verifye Tikè</h1>

        <p>
            Antre kòd tikè kliyan an pou verifye li.
        </p>

    </div>


    <section class="verify-card">

        <label class="input-label">
            Kòd Tikè
        </label>

        <div class="search-box">

            <input
                type="text"
                id="ticketCode"
                placeholder="Egzanp: LX-20260820-123456"
                autocomplete="off"
            >

            <button
                class="verify-btn"
                onclick="verifyTicket()"
            >
                VERIFYE
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <div id="result">

            <div class="result-card">

                <div class="result-status">

                    <div
                        id="statusIcon"
                        class="status-icon"
                    >
                        ✓
                    </div>

                    <h2 id="statusTitle">
                        Tikè Valid
                    </h2>

                    <p id="statusDescription">
                        Tikè sa a egziste nan sistèm LOTTOX.
                    </p>

                </div>


                <div class="ticket-info">

                    <div class="info-row">

                        <span>
                            Kòd Tikè
                        </span>

                        <span id="ticketId">
                            —
                        </span>

                    </div>


                    <div class="info-row">

                        <span>
                            Ajan
                        </span>

                        <span id="ticketAgent">
                            —
                        </span>

                    </div>


                    <div class="info-row">

                        <span>
                            Dat
                        </span>

                        <span id="ticketDate">
                            —
                        </span>

                    </div>


                    <div class="info-row">

                        <span>
                            Status
                        </span>

                        <span id="ticketStatus">
                            —
                        </span>

                    </div>

                </div>


                <h3 class="bet-title">
                    Detay Pari
                </h3>


                <div class="bet-table">

                    <div class="bet-head">

                        <span>
                            Jwèt
                        </span>

                        <span>
                            Nimewo
                        </span>

                        <span>
                            Tip
                        </span>

                        <span>
                            Montan
                        </span>

                    </div>


                    <div id="ticketBets">

                    </div>

                </div>


                <div class="total">

                    <span>
                        TOTAL TIKÈ
                    </span>

                    <span id="ticketTotal">
                        0 Gdes
                    </span>

                </div>


                <button
                    id="payButton"
                    class="pay-btn"
                    onclick="payTicket()"
                >
                    💰 MARKE TIKÈ A KÒM PEYE
                </button>

            </div>

        </div>

    </section>

</main>

 <script>

    /* ================= LOGIN CHECK ================= */

    const loggedIn =
        localStorage.getItem("lottoxLoggedIn");

    if (loggedIn !== "true") {

        window.location.href =
            "index.html";

    }


    /* ================= TICKETS ================= */

    let tickets =
        JSON.parse(
            localStorage.getItem("lottoxTickets")
        ) || [];


    let currentTicket = null;


    /* ================= ELEMENTS ================= */

    const ticketCode =
        document.getElementById("ticketCode");

    const result =
        document.getElementById("result");

    const message =
        document.getElementById("message");


    /* ================= FORMAT MONEY ================= */

    function formatMoney(number) {

        return Number(number)
            .toLocaleString("en-US");

    }


    /* ================= SHOW MESSAGE ================= */

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

    }


    function hideMessage() {

        message.textContent = "";

        message.className =
            "message";

    }


    /* ================= VERIFY TICKET ================= */

    function verifyTicket() {

        const code =
            ticketCode.value
                .trim()
                .toUpperCase();


        hideMessage();

        result.style.display = "none";


        if (!code) {

            showMessage(
                "⚠️ Tanpri antre kòd tikè a.",
                "error"
            );

            return;
        }


        /* FIND TICKET */

        const ticket =
            tickets.find(
                item =>
                    String(item.id)
                        .toUpperCase() === code
            );


        if (!ticket) {

            currentTicket = null;

            showInvalidTicket();

            return;
        }


        currentTicket = ticket;


        showTicket(ticket);

    }


    /* ================= INVALID TICKET ================= */

    function showInvalidTicket() {

        result.style.display = "block";


        const icon =
            document.getElementById(
                "statusIcon"
            );


        icon.className =
            "status-icon invalid";

        icon.textContent = "✕";


        document.getElementById(
            "statusTitle"
        ).textContent =
            "Tikè Pa Jwenn";


        document.getElementById(
            "statusDescription"
        ).textContent =
            "Kòd sa a pa egziste nan sistèm LOTTOX.";


        document.getElementById(
            "ticketId"
        ).textContent =
            "—";


        document.getElementById(
            "ticketAgent"
        ).textContent =
            "—";


        document.getElementById(
            "ticketDate"
        ).textContent =
            "—";


        document.getElementById(
            "ticketStatus"
        ).textContent =
            "INVALID";


        document.getElementById(
            "ticketBets"
        ).innerHTML = "";


        document.getElementById(
            "ticketTotal"
        ).textContent =
            "0 Gdes";


        document.getElementById(
            "payButton"
        ).style.display =
            "none";


        showMessage(
            "❌ Tikè sa a pa jwenn.",
            "error"
        );

    }


    /* ================= SHOW TICKET ================= */

    function showTicket(ticket) {

        result.style.display = "block";


        const icon =
            document.getElementById(
                "statusIcon"
            );


        const title =
            document.getElementById(
                "statusTitle"
            );


        const description =
            document.getElementById(
                "statusDescription"
            );


        const status =
            document.getElementById(
                "ticketStatus"
            );


        const payButton =
            document.getElementById(
                "payButton"
            );


        /* BASIC INFO */

        document.getElementById(
            "ticketId"
        ).textContent =
            ticket.id;


        document.getElementById(
            "ticketAgent"
        ).textContent =
            ticket.agent || "Agent";


        document.getElementById(
            "ticketDate"
        ).textContent =
            new Date(ticket.date)
                .toLocaleString("fr-FR");


        /* ================= PAID ================= */

        if (ticket.paid === true) {

            icon.className =
                "status-icon paid";

            icon.textContent =
                "✓";


            title.textContent =
                "DEJA PEYE";


            description.textContent =
                "Tikè sa a deja resevwa peman.";


            status.textContent =
                "PAID";


            status.style.color =
                "#6faeff";


            payButton.style.display =
                "none";

        }

        /* ================= WINNER ================= */

        else if (
            ticket.status === "WINNER"
        ) {

            icon.className =
                "status-icon winner";

            icon.textContent =
                "🏆";


            title.textContent =
                "TIKÈ GANYAN";


            description.textContent =
                "Tikè sa a genyen. Li pare pou peman.";


            status.textContent =
                "WINNER";


            status.style.color =
                "#ffd000";


            payButton.style.display =
                "block";

        }

        /* ================= VALID ================= */

        else {

            icon.className =
                "status-icon valid";

            icon.textContent =
                "✓";


            title.textContent =
                "TIKÈ VALID";


            description.textContent =
                "Tikè sa a egziste, men li poko make kòm gayan.";


            status.textContent =
                ticket.status || "VALID";


            status.style.color =
                "#20d46b";


            payButton.style.display =
                "none";

        }


        /* ================= BETS ================= */

        const betsContainer =
            document.getElementById(
                "ticketBets"
            );


        betsContainer.innerHTML = "";


        if (
            !ticket.bets ||
            ticket.bets.length === 0
        ) {

            betsContainer.innerHTML = `

                <div
                    style="
                        padding:15px;
                        text-align:center;
                        color:#777;
                        font-size:11px;
                    "
                >
                    Pa gen detay pari.
                </div>

            `;

        } else {

            ticket.bets.forEach(
                bet => {

                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "bet-row";


                    row.innerHTML = `

                        <span>
                            ${escapeHTML(
                                bet.game
                            )}
                        </span>

                        <span>
                            ${escapeHTML(
                                bet.number
                            )}
                        </span>

                        <span>
                            ${escapeHTML(
                                bet.type
                            )}
                        </span>

                        <span>
                            ${formatMoney(
                                bet.amount
                            )}
                            Gdes
                        </span>

                    `;


                    betsContainer.appendChild(
                        row
                    );

                }
            );

        }


        /* TOTAL */

        document.getElementById(
            "ticketTotal"
        ).textContent =
            formatMoney(
                ticket.total || 0
            ) +
            " Gdes";

    }


    /* ================= MARK AS PAID ================= */

    function payTicket() {

        if (!currentTicket) {

            return;

        }


        if (
            currentTicket.paid === true
        ) {

            alert(
                "⚠️ Tikè sa a deja peye."
            );

            return;

        }


        const confirmation =
            confirm(
                "Èske ou konfime ou vle make tikè sa a kòm PEYE?"
            );


        if (!confirmation) {

            return;

        }


        /* FIND ORIGINAL TICKET */

        const index =
            tickets.findIndex(
                ticket =>
                    ticket.id ===
                    currentTicket.id
            );


        if (index === -1) {

            alert(
                "❌ Tikè a pa jwenn ankò."
            );

            return;

        }


        /* UPDATE */

        tickets[index].paid = true;

        tickets[index].status = "PAID";

        tickets[index].paidAt =
            new Date().toISOString();


        /* SAVE */

        localStorage.setItem(
            "lottoxTickets",
            JSON.stringify(tickets)
        );


        /* UPDATE CURRENT */

        currentTicket =
            tickets[index];


        /* DISPLAY */

        showTicket(currentTicket);


        showMessage(
            "✅ Tikè a make kòm PEYE avèk siksè.",
            "success"
        );

    }


    /* ================= ESCAPE HTML ================= */

    function escapeHTML(value) {

        return String(value ?? "")
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* ================= BACK ================= */

    function goBack() {

        window.location.href =
            "dashboard.html";

    }


    /* ================= ENTER KEY ================= */

    ticketCode.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                verifyTicket();

            }

        }
    );


    /* ================= AUTO CLEAN ================= */

    ticketCode.addEventListener(
        "input",
        function() {

            this.value =
                this.value
                    .toUpperCase();

        }
    );

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ht">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LOTTOX — Admin Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    min-height:100vh;

    background:
    radial-gradient(
        circle at top,
        #182028 0%,
        #080a0d 50%,
        #030405 100%
    );

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}

.login-page{

    width:100%;

    max-width:400px;

    text-align:center;

}

.brand{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:11px;

    margin-bottom:10px;

}

.logo{

    width:45px;

    height:45px;

    border-radius:12px;

    background:
    linear-gradient(
        145deg,
        #ffd700,
        #ff9d00
    );

    color:#090909;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:19px;

    font-weight:900;

}

.brand-name{

    font-size:24px;

    font-weight:900;

    letter-spacing:2px;

}

.subtitle{

    color:#777f87;

    font-size:11px;

    margin-bottom:25px;

}

.card{

    background:
    rgba(15,18,22,.98);

    border:1px solid #292f35;

    border-radius:18px;

    padding:25px;

    text-align:left;

    box-shadow:
    0 20px 60px
    rgba(0,0,0,.35);

}

.card h1{

    font-size:20px;

    margin-bottom:7px;

}

.card p{

    color:#707880;

    font-size:11px;

    margin-bottom:22px;

}

.field{

    margin-bottom:16px;

}

.field label{

    display:block;

    color:#aeb4ba;

    font-size:11px;

    margin-bottom:7px;

}

.input-box{

    display:flex;

    align-items:center;

    gap:9px;

    height:48px;

    padding:0 12px;

    background:#090b0e;

    border:1px solid #30363d;

    border-radius:10px;

}

.input-box span{

    font-size:15px;

}

.input-box input{

    width:100%;

    height:100%;

    border:none;

    outline:none;

    background:transparent;

    color:#fff;

    font-size:13px;

}

.login-btn{

    width:100%;

    height:49px;

    border:none;

    border-radius:10px;

    background:
    linear-gradient(
        135deg,
        #ffd700,
        #ff9d00
    );

    color:#080808;

    font-weight:900;

    cursor:pointer;

    margin-top:5px;

}

.login-btn:active{

    transform:scale(.98);

}

.status{

    margin-top:18px;

    color:#32db78;

    font-size:10px;

    text-align:center;

}

.dot{

    display:inline-block;

    width:7px;

    height:7px;

    background:#32db78;

    border-radius:50%;

    margin-right:5px;

}

.footer{

    margin-top:20px;

    color:#555d65;

    font-size:9px;

}

.error{

    display:none;

    color:#ff7070;

    background:
    rgba(255,70,70,.07);

    border:1px solid
    rgba(255,70,70,.18);

    padding:10px;

    border-radius:8px;

    font-size:10px;

    margin-bottom:15px;

}

</style>

</head>


<body>


<div class="login-page">


    <div class="brand">

        <div class="logo">
            X
        </div>

        <div class="brand-name">
            LOTTOX
        </div>

    </div>


    <div class="subtitle">
        Smart Lottery Management System
    </div>


    <div class="card">

        <h1>
            🔐 Admin Login
        </h1>

        <p>
            Konekte kòm administratè
            pou jere sistèm LOTTOX la.
        </p>


        <div
            class="error"
            id="error"
        >
            ❌ ID Admin oswa modpas la pa kòrèk.
        </div>


        <div class="field">

            <label>
                ID Admin
            </label>

            <div class="input-box">

                <span>
                    👤
                </span>

                <input
                    type="text"
                    id="adminId"
                    placeholder="Antre ID admin"
                    autocomplete="off"
                >

            </div>

        </div>


        <div class="field">

            <label>
                Modpas
            </label>

            <div class="input-box">

                <span>
                    🔐
                </span>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Antre modpas admin"
                >

            </div>

        </div>


        <button
            class="login-btn"
            onclick="adminLogin()"
        >
            KONEKTE ADMIN →
        </button>


    </div>


    <div class="status">

        <span class="dot"></span>

        LOTTOX System Online

    </div>


    <div class="footer">

        © 2026 LOTTOX —
        All Rights Reserved

    </div>


  </div>
<script>

function adminLogin(){

    const id =
        document.getElementById("adminId")
        .value.trim().toUpperCase();

    const password =
        document.getElementById("adminPassword")
        .value.trim();

    if(id === "ADMIN" && password === "LOTTOX2026"){

        localStorage.setItem(
            "lottoxAdminLoggedIn",
            "true"
        );

        localStorage.setItem(
            "lottoxLoggedIn",
            "true"
        );

        window.location.href = "admin.html";

    }else{

        alert(
            "❌ Kòd la pa kòrèk.\n\n" +
            "ID: ADMIN\n" +
            "Modpas: LOTTOX2026"
        );

    }

}

document
.getElementById("adminPassword")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            adminLogin();
        }

    }
);

</script>

</body>
</html>
